[project]
name = "docuqa-v2"
version = "0.1.0"
description = "Local document summaries, grounded Q&A and agent-assisted version comparison with Streamlit and Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "filelock>=4.2.4",
    "httpx>=0.28.1",
    "langchain-core>=1.6.13",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.1",
    "word2pdf[images]==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

